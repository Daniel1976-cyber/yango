services:
  - type: web
    name: yango-api
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend_elromero.wsgi:application
    envVars:
      - key: SECRET_KEY
        value: django-insecure-%w!lhn_uq*x)r_iyp1@xy(q415exu3e#tjl=po!x6jqux$o4cl
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: yango-db
          property: connectionString

databases:
  - name: yango-db
    region: frankfurt
