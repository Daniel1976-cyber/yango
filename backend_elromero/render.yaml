services:
  - type: web
    name: yango-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend_elromero.wsgi:application
    envVars:
      - key: SECRET_KEY
        value: DZxOwSm4x2fxa8Iy
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: yango-db
          property: connectionString

databases:
  - name: yango-db
    region: oregon
